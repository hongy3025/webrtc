  <head>
    <title>ice-restart</title>
  </head>

  <body>
    <!-- 点击触发一次带 {iceRestart: true} 的 Offer，演示重启 -->
    <button onclick="window.doSignaling(true)"> ICE Restart </button><br />


    <!-- 展示 ICE 连接状态变更日志（checking/connected/disconnected/failed 等） -->
    <h3> ICE Connection States </h3>
    <div id="iceConnectionStates"></div> <br />

    <!-- 定期读取当前选定的候选对（local/remote）并显示，观察重启后变化 -->
    <h3> ICE Selected Pairs </h3>
    <div id="iceSelectedPairs"></div> <br />

    <!-- 展示来自服务端的 DataChannel 文本消息（每 3 秒发送当前时间） -->
    <h3> Inbound DataChannel Messages </h3>
    <div id="inboundDataChannelMessages"></div>
  </body>

  <script>
    // 创建 RTCPeerConnection，提供公共 STUN 服务器以收集候选
    let pc = new RTCPeerConnection({
      iceServers: [
        {
          urls: 'stun:stun.l.google.com:19302'
        }
      ]
    })
    // 主动创建一个名为 'data' 的 DataChannel，连接建立后与服务端互通
    let dc = pc.createDataChannel('data')

    // DataChannel 打开后：每 3 秒展示当前选定的 ICE Candidate Pair
    dc.onopen = () => {
      setInterval(function() {
        let el = document.createElement('template')
        // 通过 SCTP -> DTLS -> ICETransport 获取当前选中的候选对
        let selectedPair = pc.sctp.transport.iceTransport.getSelectedCandidatePair()

        el.innerHTML = `<div>
          <ul>
             <li> <i> Local</i> - ${selectedPair.local.candidate}</li>
             <li> <i> Remote</i> - ${selectedPair.remote.candidate} </li>
          </ul>
        </div>`

        document.getElementById('iceSelectedPairs').appendChild(el.content.firstChild);
      }, 3000);
    }

    // 收到服务端经 DataChannel 发送的文本（当前时间），追加到页面
    dc.onmessage = event => {
      let el = document.createElement('p')
      el.appendChild(document.createTextNode(event.data))

      document.getElementById('inboundDataChannelMessages').appendChild(el);
    }

    // 监听 ICE 连接状态并追加日志，用于观察重启效果
    pc.oniceconnectionstatechange = () => {
      let el = document.createElement('p')
      el.appendChild(document.createTextNode(pc.iceConnectionState))

      document.getElementById('iceConnectionStates').appendChild(el);
    }


    // 执行信令交换：生成 Offer（可选启用 ICE Restart），POST 至服务端，设置返回的 Answer
    window.doSignaling = iceRestart => {
      pc.createOffer({iceRestart})
        .then(offer => {
          pc.setLocalDescription(offer) // 设置本地描述，触发候选收集

          return fetch(`/doSignaling`, {
            method: 'post',
            headers: {
              'Accept': 'application/json, text/plain, */*',
              'Content-Type': 'application/json'
            },
            body: JSON.stringify(offer) // 仅进行一次性信令交换，未开启 Trickle
          })
        })
        .then(res => res.json())
        .then(res => pc.setRemoteDescription(res)) // 设置远端描述，完成协商
        .catch(alert)
    }

    // 页面加载后自动发起一次普通协商，建立连接
    window.doSignaling(false)
  </script>
</html>
